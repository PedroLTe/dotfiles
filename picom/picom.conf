# picom: cantos arredondados, transparência e sombras suaves
backend = "glx";
vsync = true;

corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'i3bar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# a transparência do terminal vem do próprio kitty (background_opacity);
# aqui só deixo janelas sem foco levemente apagadas
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;
opacity-rule = [ "100:class_g = 'Rofi'", "100:fullscreen" ];

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [ "class_g = 'i3bar'", "_GTK_FRAME_EXTENTS@" ];

fading = true;
fade-delta = 5;
fade-in-step = 0.05;
fade-out-step = 0.05;
