# Tela de login (lightdm-gtk-greeter) com o tema natureza.
# Instalado em /etc/lightdm/ pelo lightdm/instalar.sh (precisa de sudo).
[greeter]
background = /usr/share/backgrounds/natureza/floresta.png
user-background = false
theme-name = Natureza
icon-theme-name = Adwaita
font-name = JetBrains Mono 11
cursor-theme-name = Adwaita
xft-antialias = true
xft-hintstyle = hintslight
xft-rgba = rgb
position = 50%,center 50%,center
panel-position = top
clock-format = %a, %d de %b  %H:%M
indicators = ~host;~spacer;~clock;~spacer;~session;~language;~power
hide-user-image = false
round-user-image = true
